# AgentTown_v3 — 开发实例 Hermes Docker 部署
#
# 与 docker-compose.yml 的区别：
#   - 容器名 agenttown-h01-dev（避免与稳定实例冲突）
#   - 端口 8643（稳定实例用 8642）
#   - volume agenttown-hermes-data-dev（独立数据卷）
#   - profile h01-dev（独立配置，端口指向开发实例的 Adapter/MCP）
#
# 使用：
#   docker compose --env-file ../.env -f docker/docker-compose-dev.yml up -d
#   docker compose -f docker/docker-compose-dev.yml logs -f
#   docker compose -f docker/docker-compose-dev.yml down

services:
  h01-gateway-dev:
    image: hermes-agent:latest
    container_name: agenttown-h01-dev
    ports:
      - "8643:8643"
    volumes:
      - hermes-data-dev:/opt/data
      - ../hermes/profiles/h01-dev:/opt/data/profiles/h01-dev
    # H-01-dev 与稳定实例配置相同，仅端口不同
    tmpfs:
      - /opt/data/profiles/h01-dev/skills
    environment:
      - GATEWAY_ALLOW_ALL_USERS=true
      - TERMINAL_CWD=/opt/data
    env_file:
      - ../.env
    entrypoint: ["hermes"]
    command:
      - "-p"
      - "h01-dev"
      - "gateway"
      - "run"
      - "--accept-hooks"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8643/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  hermes-data-dev:
    name: agenttown-hermes-data-dev

# AgentTown_v3 一期 — 单 Agent (H-01 老陈) Docker 部署
#
# 前置：先构建 Hermes 镜像
#   bash docker/build-hermes.sh
#
# 使用：
#   docker compose --env-file ../.env -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml logs -f
#   docker compose -f docker/docker-compose.yml down

services:
  h01-gateway:
    image: hermes-agent:latest
    container_name: agenttown-h01
    ports:
      - "8642:8642"
    volumes:
      - hermes-data:/opt/data
      - ../hermes/profiles/h01:/opt/data/profiles/h01
    environment:
      # Gateway 一期关闭外部门控，接受所有请求
      - GATEWAY_ALLOW_ALL_USERS=true
    env_file:
      - ../.env
    # 绕过 s6-overlay 交互模式，直接启动 Hermes Gateway
    entrypoint: ["hermes"]
    command:
      - "-p"
      - "h01"
      - "gateway"
      - "run"
      - "--accept-hooks"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8641/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  hermes-data:
    name: agenttown-hermes-data

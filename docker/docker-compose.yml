# AgentTown_v3 一期 — 单 Agent (H-01 老陈) Docker 部署
#
# 前置：先构建 Hermes 镜像
#   bash docker/build-hermes.sh
#
# 使用：
#   docker compose --env-file ../.env -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml logs -f
#   docker compose -f docker/docker-compose.yml down

services:
  h01-gateway:
    image: hermes-agent:latest
    container_name: agenttown-h01
    ports:
      - "8642:8642"
    volumes:
      - hermes-data:/opt/data
      - ../hermes/profiles/h01:/opt/data/profiles/h01
    # H-01 only needs its SOUL/SKILL plus AgentTown MCP tools. Hide the
    # profile's large generic skills tree at runtime without deleting it from
    # the host, preventing dozens of unrelated skills from entering context.
    tmpfs:
      - /opt/data/profiles/h01/skills
    environment:
      # Gateway 一期关闭外部门控，接受所有请求
      - GATEWAY_ALLOW_ALL_USERS=true
      # TERMINAL_CWD 决定 Hermes 在哪个目录查找 context 文件（AGENTS.md /
      # .cursorrules / CLAUDE.md）和 git 快照。默认 fallback 到镜像 WORKDIR
      # /opt/hermes，那里有 71KB 的 AGENTS.md 和 .git，会被注入 system prompt
      # 浪费 ~18k tokens。指向 /opt/data（只有 profiles/，无 context 文件）。
      - TERMINAL_CWD=/opt/data
    env_file:
      - ../.env
    # 绕过 s6-overlay 交互模式，直接启动 Hermes Gateway
    entrypoint: ["hermes"]
    command:
      - "-p"
      - "h01"
      - "gateway"
      - "run"
      - "--accept-hooks"
    # 让容器内可解析 host.docker.internal → 宿主机，用于连接 host 上运行的 agenttown-mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  hermes-data:
    name: agenttown-hermes-data

# LLM 推理服务配置（OpenAI Chat Completions 兼容）
#
# Venus 与自建 SGLang 共用同一份 OpenAI 兼容协议，仅 base_url / model / api_key
# 不同。切换后端只需改下面 base_url/model/api_key，然后带
#   --llm-config=assets/llm_backend.yaml
# 重启 MCP（不传该 flag 时走 --venus-url 等原有 flag）。
#
# 注意：base_url 是服务根地址，客户端会自动拼接 /v1/chat/completions，
# 不要在这里带 /v1 后缀。

# ─── 自建 SGLang（Qwen2.5-7B-Instruct-GPTQ-Int4）───
base_url: "http://21.6.67.160:30000"
api_key: ""                                          # 自建服务通常无需认证
model: "Qwen2.5-7B-Instruct-GPTQ-Int4"               # 战术层模型
strategic_model: "Qwen2.5-7B-Instruct-GPTQ-Int4"     # 战略层模型（留空回退 model）
timeout_sec: 120                                     # 单次调用 HTTP 超时（秒）


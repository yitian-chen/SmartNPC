# LLM 推理服务分层配置（OpenAI Chat Completions 兼容）
#
# 三层决策（战略 / 战术 / 对话）统一指向自部署 vLLM 推理服务。
#   - 战略层 → vLLM（生成每日计划，一天一次）
#   - 战术层 + 对话层 → vLLM（高频调用；对话层复用战术层客户端）
#
# 带 --llm-config=assets/llm_backend.yaml 重启 MCP 生效
# （不传该 flag 时走 --venus-url 等原有 flag，战略/战术共用同一 Venus）。
#
# 地址二选一：
#   - 自建服务用 host + port；
#   - 带路径的服务（如 Venus）用 base_url 覆盖 host+port。
# 注意：地址是服务根地址，客户端会自动拼接 /v1/chat/completions，
# 不要在这里带 /v1 后缀。

# ─── 战略层（每日计划生成）───
strategic:
  host: "127.0.0.1"
  port: 8000
  model: "Qwen3-8B-FP8"
  api_key: ""                    # 自建 vLLM 通常无需认证
  timeout_sec: 120

# ─── 战术层 + 对话层（高频调用）───
tactical:
  host: "127.0.0.1"
  port: 8000
  model: "Qwen3-8B-FP8"
  api_key: ""                    # 自建 vLLM 通常无需认证
  timeout_sec: 120

# World Knowledge Base — AgentTown 园区世界字典
#
# 这是 UE5 场景的导出物（目前由手写维护，未来由 UE 端 WorldKBExporter 自动生成）。
# MCP 层启动时加载此文件，把语义 ID 解析为坐标，供 move_to 等工具下发。
# Mock UE (src/agenttown/mock_ue.py) 也读同一份文件作为唯一真相源。
#
# 坐标单位：UE5 centimeter（如 [16000, 10000, 0] 表示 X=160m, Y=100m, Z=0）。
# 与 src/agenttown/mock_ue.py 中原有硬编码 dict 数据对齐。
#
# 字段参考 docs/AgentTown_Design.md §子系统1 的 YAML schema。

version: "1.0"

site:
  id: industrial_park
  name: "工业机器人园区"

# ─── Zones（区域，由 UE5 BoxTrigger 导出） ─────────────────────────
zones:
  - id: main_workshop
    name: "主生产车间"
    description: "机器人们的主要工作场所"
    ue5_bounds:
      center: [20000, 10000, 0]        # BoxTrigger 位置
      half_size: [5000, 5000, 5000]    # BoxComponent 半尺寸
    entry_point: [16000, 10000, 0]     # 自动计算的入口
    connected_to: [central_plaza]
    locations: [workbench_01, charging_station_01]

  - id: central_plaza
    name: "中央广场"
    description: "园区中央的开放广场，机器人休息社交的场所"
    ue5_bounds:
      center: [11500, 11500, 0]
      half_size: [3500, 3500, 5000]
    entry_point: [10000, 10000, 0]
    connected_to: [main_workshop, charging_station]
    locations: []

  - id: charging_station
    name: "充电站"
    description: "园区充电设施所在区域"
    ue5_bounds:
      center: [22500, 7500, 0]
      half_size: [2500, 2500, 5000]
    entry_point: [21500, 8500, 0]
    connected_to: [central_plaza]
    locations: [charging_station_01]

# ─── Locations（地点，由 Smart Object Actor 导出） ────────────────
locations:
  - id: workbench_01
    name: "工作台一号"
    zone: main_workshop
    type: workstation
    position: [20000, 10000, 0]          # Actor->GetActorLocation()
    interaction_point: [19500, 10500, 0] # InteractionSocket 世界坐标
    interaction_radius: 1500             # cm，用于 mock_ue 坐标反推 current_location
    facing: [1, 0, 0]
    available_actions: [assemble, inspect]
    ue5_ref: "BP_Workbench_01"

  - id: charging_station_01
    name: "充电桩一号"
    zone: main_workshop
    type: charging
    position: [21500, 8500, 0]
    interaction_point: [21500, 8500, 0]
    interaction_radius: 1500
    facing: [1, 0, 0]
    available_actions: [charge, inspect]
    ue5_ref: "BP_ChargingStation_01"

# ─── Objects（智能对象，与 Location 一一对应） ─────────────────────
objects:
  - id: workbench_01
    available_actions: [assemble, inspect]
    required_role: [worker]
    capacity: 1
    ue5_ref: "BP_Workbench_01"

  - id: charging_station_01
    available_actions: [charge, inspect]
    required_role: []
    capacity: 1
    ue5_ref: "BP_ChargingStation_01"

# ─── Agents（园区内的 NPC 定义） ───────────────────────────────────
agents:
  - id: H-01
    name: "老陈"
    type: humanoid
    role: [supervisor, worker]
    capabilities: [move_to, speak, emote, work_assemble]
    default_zone: main_workshop
    default_position: [20000, 10000, 0]
    ue5_class: "BP_HumanoidRobot"
    ue5_variant: "H01_LaoChen"

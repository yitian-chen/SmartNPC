model:
  provider: custom:venus
  # Venus 内部 LLM 代理平台（OpenAI Chat Completions API 兼容）。
  # 替代原 CodeBuddy Adapter + DeepSeek 方案：MCP 仍走 Hermes Gateway，
  # Hermes 后端改为直连 Venus，由 Venus 提供 qwen3.6-35b-a3b 模型。
  # 认证用 Bearer Token，key_env 指向 .env 中的 VENUS_API_KEY；
  # 该 .env 通过 docker-compose 的 env_file 透传到 Hermes 容器内。
  # 经测试 Venus 不需要 Venus-Sticky-Routing 头即可正常路由。
  #
  # === stable 实例配置 ===
  # 端口用 stable 默认（与 dev 实例 8770/8643 隔离）：MCP HTTP 8760 / Hermes 8642
  default: qwen3.6-35b-a3b
  base_url: http://v2.open.venus.oa.com/llmproxy/v1
  api_mode: chat_completions
  # Venus qwen3.6-35b-a3b 实际上下文上限 65536 tokens（不是 128000）。
  # 此值用于 Hermes 压缩预算计算（effective_window = context_length - max_tokens）。
  # 经 Venus 400 错误信息确认："model's maximum context length of 65536 tokens"
  context_length: 65536
  # 输出 token 上限。Hermes 把此值作为 max_tokens 发给上游 LLM。
  # 若不设置，custom provider profile 默认 65536，导致
  #   input(12k) + max_output(65536) > 65536 → Venus HTTP 400
  #   → Hermes 压缩失败 → 战术/战略层收到"Context length exceeded"错误字符串
  # 设为 8192 留出输入空间：input + output ≤ 65536
  max_tokens: 8192
providers:
  venus:
    name: venus
    base_url: http://v2.open.venus.oa.com/llmproxy/v1
    key_env: VENUS_API_KEY
    default_model: qwen3.6-35b-a3b
    api_mode: chat_completions
    discover_models: false
agent:
  tool_use_enforcement: true
  task_completion_guidance: false
  parallel_tool_call_guidance: false
  environment_probe: false
  disabled_toolsets:
    - skills_tools
    - memory
compression:
  enabled: true
  threshold: 0.3
  target_ratio: 0.25
  protect_last_n: 12
  hygiene_hard_message_limit: 80
_config_version: 34
API_SERVER_ENABLED: true
API_SERVER_KEY: agenttown-test-key
API_SERVER_HOST: 0.0.0.0
API_SERVER_PORT: 8642
API_SERVER_MODEL_NAME: h01
mcp_servers:
  agenttown:
    url: http://host.docker.internal:8760/mcp
    enabled: true

model:
  provider: custom:agenttown
  default: deepseek-v4-pro
  base_url: https://api.deepseek.com
  api_mode: chat_completions
  context_length: 128000
providers:
  agenttown:
    name: agenttown
    base_url: https://api.deepseek.com
    key_env: HERMES_AGENT_API_KEY
    default_model: deepseek-v4-pro
    api_mode: chat_completions
    discover_models: false
agent:
  tool_use_enforcement: true
  # 以下三项关闭 coding guidance 系统提示块（~3.5KB）以节省 token：
  # - task_completion_guidance: 防 LLM 假完成路径，h01 工具链简单不需要
  # - parallel_tool_call_guidance: 引导并行工具调用，h01 每轮至多 1 个工具
  # - environment_probe: 注入宿主 Python/pip 版本行，容器内无意义
  task_completion_guidance: false
  parallel_tool_call_guidance: false
  environment_probe: false
  # 禁用 skills_tools 工具集（skills_list/skill_view/skill_manage）：
  # 1. 移除 3 个工具 schema（每个 ~200 token）
  # 2. system_prompt.py:292 检测到无 skills 工具时，跳过 build_skills_system_prompt，
  #    整个 73 条 skills 索引（~1,440 token）不注入系统提示
  # 3. turn_finalizer.py:488 的 skill 背景审查（bg-review 线程）因 skill_manage
  #    不在 valid_tool_names 而永不触发，省掉每轮额外的 LLM 审查调用
  disabled_toolsets:
    - skills_tools
compression:
  enabled: true
  threshold: 0.3
  target_ratio: 0.25
  protect_last_n: 12
  hygiene_hard_message_limit: 80
_config_version: 33
API_SERVER_ENABLED: true
API_SERVER_KEY: agenttown-test-key
API_SERVER_HOST: 0.0.0.0
API_SERVER_PORT: 8642
API_SERVER_MODEL_NAME: h01
mcp_servers:
  agenttown:
    url: http://host.docker.internal:8760/mcp
    enabled: true

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4

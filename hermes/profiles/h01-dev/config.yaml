model:
  provider: custom:agenttown
  # CodeBuddy CLI 适配层（复用 CLI OAuth 认证，详见 src/agenttown/codebuddy_adapter.py）
  # 适配层运行在 Windows 宿主，Docker 容器通过 WSL vEthernet 网卡 IP 访问。
  # IP 172.18.16.1 是 Windows 的 vEthernet (WSL) 适配器地址，可能在 Windows 重启后变化。
  # 查询当前 IP：PowerShell `Get-NetIPAddress -InterfaceAlias "vEthernet (WSL (Hyper-V firewall))" -AddressFamily IPv4`
  # 或在 WSL 里 `ip route show | grep default`（default via <IP> dev eth0，那个 <IP> 就是 Windows 宿主）
  #
  # === 开发实例配置 ===
  # 端口与稳定实例 (h01) 错开：Adapter 8771 / MCP HTTP 8770 / Hermes 8643
  default: deepseek-v4-pro-ioa
  base_url: http://172.18.16.1:8771/v1
  api_mode: chat_completions
  context_length: 128000
providers:
  agenttown:
    name: agenttown
    base_url: http://172.18.16.1:8771/v1
    key_env: HERMES_AGENT_API_KEY
    default_model: deepseek-v4-pro-ioa
    api_mode: chat_completions
    discover_models: false
agent:
  tool_use_enforcement: true
  task_completion_guidance: false
  parallel_tool_call_guidance: false
  environment_probe: false
  disabled_toolsets:
    - skills_tools
    - memory
compression:
  enabled: true
  threshold: 0.3
  target_ratio: 0.25
  protect_last_n: 12
  hygiene_hard_message_limit: 80
_config_version: 33
API_SERVER_ENABLED: true
API_SERVER_KEY: agenttown-test-key
API_SERVER_HOST: 0.0.0.0
API_SERVER_PORT: 8643
API_SERVER_MODEL_NAME: h01-dev
mcp_servers:
  agenttown:
    url: http://host.docker.internal:8770/mcp
    enabled: true
